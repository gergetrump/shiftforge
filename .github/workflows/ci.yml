name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shiftforge
          POSTGRES_USER: shiftforge
          POSTGRES_PASSWORD: local-demo-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U shiftforge -d shiftforge" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SHIFTFORGE_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/shiftforge
      SHIFTFORGE_TEST_DATABASE_USER: shiftforge
      SHIFTFORGE_TEST_DATABASE_PASSWORD: local-demo-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -Ppostgres verify
      - run: java -jar target/shiftforge.jar solve --example lookahead --algorithm greedy --output artifacts/greedy.json
      - run: java -jar target/shiftforge.jar check artifacts/greedy.json
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
